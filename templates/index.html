<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predicción de Precio de Vehículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        .main-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            background-color: #ffffff;
        }
        .header-title {
            color: #2b3a4a;
            font-weight: 700;
        }
        .result-box {
            background-color: #e8f4fd;
            border-left: 5px solid #0d6efd;
            border-radius: 6px;
        }
    </style>
</head>
<body class="py-5">
    <div class="container" style="max-width: 720px;">
        <div class="card main-card p-4 p-md-5">
            <h2 class="header-title text-center mb-2">Cotizador de Vehículos Usados</h2>
            <p class="text-center text-muted mb-4">Ingresa las características del vehículo para estimar su valor comercial (INR).</p>

            {% if prediction %}
            <div class="result-box p-3 mb-4">
                <h5 class="mb-1 text-primary">Resultado de la Estimación</h5>
                <p class="mb-0">Precio estimado: <strong>{{ prediction }} INR</strong></p>
            </div>
            {% endif %}

            <form action="/predict" method="post">
                <div class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Nombre / Marca y Modelo</label>
                        <input type="text" class="form-control" name="name" placeholder="Ej. Maruti Swift Dzire VDI, BMW X5..." required value="{{ input_data.name if input_data else '' }}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Año de Fabricación</label>
                        <input type="number" class="form-control" name="year" min="1990" max="2020" step="1" required value="{{ input_data.year if input_data else '2016' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Kilometraje Recorrido (km)</label>
                        <input type="number" class="form-control" name="km_driven" min="0" step="500" required value="{{ input_data.km_driven if input_data else '50000' }}">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Tipo de Combustible</label>
                        <select class="form-select" name="fuel" required>
                            <option value="Diesel" {% if input_data and input_data.fuel == 'Diesel' %}selected{% endif %}>Diésel</option>
                            <option value="Petrol" {% if input_data and input_data.fuel == 'Petrol' %}selected{% endif %}>Gasolina (Petrol)</option>
                            <option value="CNG" {% if input_data and input_data.fuel == 'CNG' %}selected{% endif %}>GNC (CNG)</option>
                            <option value="LPG" {% if input_data and input_data.fuel == 'LPG' %}selected{% endif %}>GLP (LPG)</option>
                            <option value="Electric" {% if input_data and input_data.fuel == 'Electric' %}selected{% endif %}>Eléctrico</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Transmisión</label>
                        <select class="form-select" name="transmission" required>
                            <option value="Manual" {% if input_data and input_data.transmission == 'Manual' %}selected{% endif %}>Manual</option>
                            <option value="Automatic" {% if input_data and input_data.transmission == 'Automatic' %}selected{% endif %}>Automática</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Canal de Venta</label>
                        <select class="form-select" name="seller_type" required>
                            <option value="Individual" {% if input_data and input_data.seller_type == 'Individual' %}selected{% endif %}>Particular (Individual)</option>
                            <option value="Dealer" {% if input_data and input_data.seller_type == 'Dealer' %}selected{% endif %}>Concesionario (Dealer)</option>
                            <option value="Trustmark Dealer" {% if input_data and input_data.seller_type == 'Trustmark Dealer' %}selected{% endif %}>Trustmark Dealer</option>
                        </select>
                    </div>

                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Propietario Previo</label>
                        <select class="form-select" name="owner" required>
                            <option value="First Owner" {% if input_data and input_data.owner == 'First Owner' %}selected{% endif %}>Primer Dueño</option>
                            <option value="Second Owner" {% if input_data and input_data.owner == 'Second Owner' %}selected{% endif %}>Segundo Dueño</option>
                            <option value="Third Owner" {% if input_data and input_data.owner == 'Third Owner' %}selected{% endif %}>Tercer Dueño</option>
                            <option value="Fourth & Above Owner" {% if input_data and input_data.owner == 'Fourth & Above Owner' %}selected{% endif %}>4to o Más</option>
                            <option value="Test Drive Car" {% if input_data and input_data.owner == 'Test Drive Car' %}selected{% endif %}>Auto Test Drive</option>
                        </select>
                    </div>

                    <div class="col-12 mt-4 text-center">
                        <button type="submit" class="btn btn-primary px-5 py-2 fw-semibold">Estimar Precio</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
