[project]
name = "mlopsProyecto"
version = "0.1.0"
description = "Pipeline End-to-End para prediccion de precios de vehiculos usados"
readme = "README.md"
requires-python = ">=3.11, <3.12"
dependencies = [
    "fastapi>=0.135.3",
    "gunicorn>=23.0.0",
    "httpx>=0.28.1",
    "ipykernel>=6.30.1",
    "ipywidgets>=8.1.8",
    "jinja2>=3.1.6",
    "matplotlib>=3.10.5",
    "mlflow>=3.15.2",
    "numpy>=2.3.2",
    "optuna>=4.4.0",
    "pandas>=2.3.1",
    "prefect>=3.4.12",
    "pyarrow>=21.0.0",
    "python-multipart>=0.0.20",
    "scikit-learn==1.6.1",
    "seaborn>=0.13.2",
    "uvicorn[standard]>=0.42.0",
    "xgboost>=3.0.4",
]

[dependency-groups]
dev = [
    "nbstripout>=0.9.1",
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
